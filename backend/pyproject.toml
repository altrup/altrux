[project]
name = "backend"
version = "0.1.0"
description = "Runs LLM and embeds the continual learning model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
    "transformers>=4.51.0",
    "bitsandbytes>=0.45.0",
]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["wheel"]

# torch and mamba-ssm are installed by `make sync` via uv pip because they
# require hardware-specific builds (ROCm torch, CUDA/ROCm kernels) that cannot
# be locked portably in uv.lock. causal-conv1d is deliberately NOT installed:
# mamba_ssm's fused causal_conv1d/Triton SSD-scan kernels segfault/hang on
# this machine's GPU (unsupported gfx1102 arch), so every model here drives
# Mamba2's mixer manually in plain PyTorch instead -- causal-conv1d is unused.
#
# bitsandbytes (used for QLoRA's 4-bit quantization, see models/common.py's
# quantize_lora_targets) has much less mature ROCm support than CUDA -- only
# needed by models that set QUANTIZE_LORA_BASE = True. No model in this repo
# currently sets that flag; quantize_lora_targets is opt-in infra for any
# future model that does. On an unsupported ROCm gfx arch (e.g. this
# machine's gfx1102), it segfaults outright unless HSA_OVERRIDE_GFX_VERSION
# is set in the shell -- see the root CLAUDE.md.
