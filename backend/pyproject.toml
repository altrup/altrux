[project]
name = "backend"
version = "0.1.0"
description = "Runs LLM and embeds the continual learning model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
    "transformers>=4.51.0",
    "bitsandbytes>=0.45.0",
]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["wheel"]

# torch and mamba-ssm are installed by `make sync` via uv pip because they
# require hardware-specific builds (ROCm torch, CUDA/ROCm kernels) that cannot
# be locked portably in uv.lock. `make sync` also installs causal-conv1d, but
# only when it detects a non-ROCm CUDA GPU (torch.cuda.is_available() and
# torch.version.hip is None): mamba_ssm's fused causal_conv1d/Triton SSD-scan
# kernels segfault/hang on this repo's local ROCm dev box (unsupported
# gfx1102 arch, re-confirmed 2026-07-02), so every model here drives Mamba2's
# mixer manually in plain PyTorch as a fallback there (see
# models/mamba2_2_7b_memory/model.py's _mixer_step, which already uses
# causal_conv1d_update when it's importable). See root CLAUDE.md.
#
# bitsandbytes (used for QLoRA's 4-bit quantization, see models/common.py's
# quantize_lora_targets) has much less mature ROCm support than CUDA -- only
# needed by models that set QUANTIZE_LORA_BASE = True. No model in this repo
# currently sets that flag; quantize_lora_targets is opt-in infra for any
# future model that does. On an unsupported ROCm gfx arch (e.g. this
# machine's gfx1102), it segfaults outright unless HSA_OVERRIDE_GFX_VERSION
# is set in the shell -- see the root CLAUDE.md.
