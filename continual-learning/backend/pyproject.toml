[project]
name = "backend"
version = "0.1.0"
description = "Runs LLM and embeds the continual learning model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
    "transformers>=4.51.0",
    "huggingface-hub>=0.30.0",
]

# torch is installed by `make sync` via uv pip because it requires
# hardware-specific builds (ROCm/CUDA) that cannot be locked portably in uv.lock.
