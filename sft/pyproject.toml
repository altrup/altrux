[project]
name = "sft"
version = "0.1.0"
description = "LoRA supervised fine-tuning of mamba2-780m for conversational use"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51.0",
    "datasets>=3.0",
    "sentencepiece>=0.2.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "bitsandbytes>=0.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# torch, causal-conv1d, and mamba-ssm are installed via `make sync`
# (hardware-specific builds; ROCm auto-detected via UV_TORCH_BACKEND=auto)
#
# bitsandbytes (used for QLoRA's 4-bit quantization, see models/common.py's
# quantize_lora_targets) has much less mature ROCm support than CUDA -- only
# needed by models that set QUANTIZE_LORA_BASE = True (currently
# mamba2_2_7b_memory). On an unsupported ROCm gfx arch (e.g. this machine's
# gfx1102), it segfaults outright unless HSA_OVERRIDE_GFX_VERSION is set in
# the shell -- see the root CLAUDE.md.
