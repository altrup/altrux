[project]
name = "sft"
version = "0.1.0"
description = "Mamba2 training and continual-learning experiments"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.51.0",
    "datasets>=3.0",
    "sentencepiece>=0.2.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# torch and mamba-ssm are installed via `make sync` (hardware-specific
# builds; ROCm auto-detected via UV_TORCH_BACKEND=auto). `make sync` also
# installs causal-conv1d, but only when it detects a non-ROCm CUDA GPU
# (torch.cuda.is_available() and torch.version.hip is None): mamba_ssm's
# fused causal_conv1d/Triton SSD-scan kernels segfault/hang on this repo's
# local ROCm dev box (unsupported gfx1102 arch, confirmed independent of
# model size, package version, and a from-source rebuild -- re-confirmed
# 2026-07-02), so every model here drives Mamba2's mixer manually in plain
# PyTorch as a fallback there (see models/mamba2_2_7b_memory/model.py's
# _mixer_step). That fused path works fine on a proper CUDA target (e.g. a
# rented H100) though, hence the conditional install rather than skipping it
# everywhere -- see root CLAUDE.md.

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]
src = [".", ".."]

[tool.ruff.lint.isort]
# `models` installs the selective_scan_cuda stub at import, so it must precede mamba_ssm.
section-order = ["future", "standard-library", "models", "third-party", "first-party", "local-folder"]
sections = { models = ["models"] }

[tool.ruff.format]
indent-style = "space"
