[project]
name = "sft"
version = "0.1.0"
description = "LoRA supervised fine-tuning of mamba2-780m for conversational use"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51.0",
    "datasets>=3.0",
    "sentencepiece>=0.2.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

# torch, causal-conv1d, and mamba-ssm are installed via `make sync`
# (hardware-specific builds; ROCm auto-detected via UV_TORCH_BACKEND=auto)
