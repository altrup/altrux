[project]
name = "sft"
version = "0.1.0"
description = "LoRA supervised fine-tuning of mamba2-780m for conversational use"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.51.0",
    "datasets>=3.0",
    "sentencepiece>=0.2.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "bitsandbytes>=0.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["wheel"]

# torch and mamba-ssm are installed via `make sync` (hardware-specific
# builds; ROCm auto-detected via UV_TORCH_BACKEND=auto). causal-conv1d is
# deliberately NOT installed: mamba_ssm's fused causal_conv1d/Triton SSD-scan
# kernels segfault/hang on this machine's GPU (unsupported gfx1102 arch,
# confirmed independent of model size, package version, and a from-source
# rebuild), so every model here drives Mamba2's mixer manually in plain
# PyTorch instead (see models/mamba2_780m_memory/model.py's _mixer_step and
# its README for the investigation) -- causal-conv1d is simply unused.
#
# bitsandbytes (used for QLoRA's 4-bit quantization, see models/common.py's
# quantize_lora_targets) has much less mature ROCm support than CUDA -- only
# needed by models that set QUANTIZE_LORA_BASE = True. No model in this repo
# currently sets that flag; quantize_lora_targets is opt-in infra for any
# future model that does. On an unsupported ROCm gfx arch (e.g. this
# machine's gfx1102), it segfaults outright unless HSA_OVERRIDE_GFX_VERSION
# is set in the shell -- see the root CLAUDE.md.
